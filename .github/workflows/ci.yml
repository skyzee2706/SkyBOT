name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skybot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skybot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare test database (same migration steps as the Vercel build)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          npx tsx scripts/db-migrate.ts pre
          npx prisma db push --skip-generate
          npx tsx scripts/db-migrate.ts post
      - run: npm run typecheck
      - run: npx vite build # dipakai juga oleh tes preview link (dist/web/index.html)
      - run: npm test
